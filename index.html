:root {
  --bg: #eef1ec;

}

}

}
* { box-sizing: border-box; }
body {

}
.wrap { max-width: 860px; margin: 0 auto; }
header.top { padding-block: 40px 18px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); font-size: 14px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 10vw, 88px); line-height: .92; margin: 6px 0 10px; text-transform: uppercase; text-wrap: balance; }
.summary { color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.summary b { color: var(--fg); font-weight: 600; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tabs { display: flex; gap: 6px; flex-basis: 100%; }
.tab { font: inherit; color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 6px 18px; cursor: pointer; font-weight: 500; }
.tab[aria-selected="true"] { background: var(--turf); color: var(--turf-ink); }
input[type=search], select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; min-width: 0; }
input[type=search] { flex: 1 1 200px; }
select { flex: 0 1 220px; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
ol.board { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.rank { font-family: var(--font-display); font-weight: 700; font-size: 36px; color: var(--muted); text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.item.podium .rank { color: var(--signal); }
.item.leader { border-color: var(--signal); }
.name { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 14px; }
.meter { height: 5px; background: var(--chip); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--turf); }
.goals { text-align: right; font-family: var(--font-display); }
.goals b { display: block; font-size: 42px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.goals small { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tag { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--signal); color: var(--bg); border-radius: 4px; padding: 1px 7px; vertical-align: middle; margin-left: 6px; }
.empty { color: var(--muted); padding: 32px 0; }
.foot { margin-top: 36px; color: var(--muted); font-size: 14px; }
@media (max-width: 520px) {
  .item { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px; }
  .name { font-size: 22px; }
  .goals b { font-size: 36px; }
}
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .35s ease; } }
</style>

const players = DATA.map(r => ({ name: r[0], team: r[1], goals: r[2], wins: r[3], draws: r[4], losses: r[5],
  played: r[3] + r[4] + r[5], pts: 3 * r[3] + r[4] }));
let view = "goals", q = "", team = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const teams = Array.from(new Set(players.map(p => p.team))).sort((a, b) => a.localeCompare(b));
$("team").insertAdjacentHTML("beforeend", teams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join(""));

function ranked() {
  const list = players.slice().sort(view === "goals"
    ? (a, b) => b.goals - a.goals || a.played - b.played || a.name.localeCompare(b.name)
    : (a, b) => b.pts - a.pts || b.wins - a.wins || b.goals - a.goals || a.name.localeCompare(b.name));
  let rank = 0, prev = null;
  list.forEach((p, i) => {
    const key = view === "goals" ? p.goals + "/" + p.played : p.pts + "/" + p.wins + "/" + p.goals;
    if (key !== prev) { rank = i + 1; prev = key; }
    p.rank = rank;
  });
  return list;
}

function render() {
  const list = ranked();
  const mv = p => view === "goals" ? p.goals : p.pts;
  const max = Math.max(1, ...list.map(mv));
  const totG = list.reduce((s, p) => s + p.goals, 0);
  const totW = list.reduce((s, p) => s + p.wins, 0), totD = list.reduce((s, p) => s + p.draws, 0);
  $("summary").innerHTML = `<b>${list.length}</b> players · ` + (view === "goals"
    ? `<b>${totG}</b> ${totG === 1 ? "goal" : "goals"} scored`
    : `<b>${totW}</b> ${totW === 1 ? "win" : "wins"} · <b>${totD}</b> ${totD === 1 ? "draw" : "draws"} recorded`);
  $("foot").textContent = view === "goals"
    ? "Ranked by goals. Players level on goals are ordered by fewer matches played, then by name. This page shows results up to " + "27 Nov 2026" + "."
    : "Best Player is ranked by points: 3 for a win, 1 for a draw, 0 for a loss. Players level on points are ordered by wins, then goals scored, then name. This page shows results up to " + "27 Nov 2026" + ".";
  const term = q.trim().toLowerCase();
  const shown = list.filter(p => (!team || p.team === team) && (!term || (p.name + " " + p.team).toLowerCase().includes(term)));
  if (!shown.length) { $("board").innerHTML = '<li class="empty">No player matches that search.</li>'; return; }
  $("board").innerHTML = shown.map(p => {
    const v = mv(p);
    const sub = [p.team, view === "goals" ? p.played + " played" : p.played + " played · " + p.wins + "W " + p.draws + "D " + p.losses + "L"].map(esc).join(" · ");
    const cls = "item" + (p.rank <= 3 && v > 0 ? " podium" : "") + (p.rank === 1 && v > 0 ? " leader" : "");
    const tag = p.rank === 1 && v > 0 ? '<span class="tag">' + (view === "goals" ? "Golden Boot" : "Best Player") + "</span>" : "";
    const unit = view === "goals" ? (v === 1 ? "goal" : "goals") : (v === 1 ? "point" : "points");
    return `<li class="${cls}"><div class="rank">${p.rank}</div>
      <div><div class="name">${esc(p.name)}${tag}</div><div class="sub">${sub}</div>
      <div class="meter"><i style="width:${Math.round(v / max * 100)}%"></i></div></div>
      <div class="goals"><b>${v}</b><small>${unit}</small></div></li>`;
  }).join("");
}

document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  view = t.dataset.view;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b === t)));
  render();
});
$("q").addEventListener("input", e => { q = e.target.value; render(); });
$("team").addEventListener("change", e => { team = e.target.value; render(); });
render();
</script>
